<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ultra-Realistic Horror Creature</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      cursor: none; /* Hide default cursor to emphasize creature tracking */
    }

    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Ambient UI Overlay */
    .overlay-ui {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
      transition: opacity 0.5s ease;
      z-index: 10;
      text-align: center;
      white-space: nowrap;
    }

    .ui-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 20;
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(15, 10, 15, 0.7);
      border: 1px solid rgba(120, 30, 30, 0.4);
      color: #aaa;
      padding: 8px 14px;
      font-size: 11px;
      letter-spacing: 1px;
      border-radius: 4px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: rgba(40, 10, 15, 0.9);
      color: #ff4444;
      border-color: rgba(255, 50, 50, 0.8);
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.4);
    }

    /* Custom Cursor Glow Indicator */
    #cursor-target {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 50, 50, 0.8) 0%, rgba(255, 0, 0, 0) 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 5;
      mix-blend-mode: screen;
      transition: width 0.2s, height 0.2s;
    }

    /* Vignette Overlay */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.95), inset 0 0 200px rgba(0, 0, 0, 0.8);
      z-index: 2;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="horrorCanvas"></canvas>
    <div class="vignette"></div>
    <div id="cursor-target"></div>

    <div class="overlay-ui" id="overlayText">
      Guide the Leviathan • Touch or Move Cursor
    </div>

    <div class="ui-controls">
      <button class="btn" id="eyeColorBtn">Shift Eyes</button>
      <button class="btn" id="burstBtn">Disturb Creature</button>
    </div>
  </div>

  <script>
    /**
     * ULTRA-REALISTIC HORROR CREATURE SIMULATION
     * Architecture: Procedural Inverse Kinematics + Multi-layer Particle Engine
     */

    window.addEventListener('load', () => {
      const canvas = document.getElementById('horrorCanvas');
      const ctx = canvas.getContext('2d');
      const cursorTarget = document.getElementById('cursor-target');
      const overlayText = document.getElementById('overlayText');

      // System Viewport Sizing
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initFog();
      });

      // Target Tracking State
      const mouse = {
        x: width / 2,
        y: height / 2,
        vx: 0,
        vy: 0,
        lastX: width / 2,
        lastY: height / 2,
        speed: 0,
        isMoving: false,
        idleTimer: 0
      };

      // Handle Mouse / Touch
      function updatePointer(x, y) {
        mouse.x = x;
        mouse.y = y;
        cursorTarget.style.left = x + 'px';
        cursorTarget.style.top = y + 'px';
        mouse.idleTimer = 0;
      }

      window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      // Eye Color Themes
      const EYE_COLORS = [
        { name: 'Red', hex: '#ff0033', glow: 'rgba(255, 0, 51, ' },
        { name: 'Amber', hex: '#ffaa00', glow: 'rgba(255, 170, 0, ' },
        { name: 'Toxic Green', hex: '#33ff33', glow: 'rgba(51, 255, 51, ' },
        { name: 'Electric Blue', hex: '#00ccff', glow: 'rgba(0, 204, 255, ' },
        { name: 'Deep Purple', hex: '#aa00ff', glow: 'rgba(170, 0, 255, ' }
      ];
      let currentEyeColorIndex = 0;

      document.getElementById('eyeColorBtn').addEventListener('click', () => {
        currentEyeColorIndex = (currentEyeColorIndex + 1) % EYE_COLORS.length;
        triggerDisturbance(false);
      });

      document.getElementById('burstBtn').addEventListener('click', () => {
        triggerDisturbance(true);
      });

      function triggerDisturbance(createSparks) {
        creature.disturbance = 1.0;
        if (createSparks) {
          for (let i = 0; i < 40; i++) {
            particles.push(new Particle(creature.head.x, creature.head.y, 'spark'));
          }
        }
      }

      // =========================================================================
      // ATMOSPHERE & PARTICLES ENGINE
      // =========================================================================

      const fogParticles = [];
      const dustParticles = [];
      const particles = [];

      function initFog() {
        fogParticles.length = 0;
        const fogCount = Math.floor((width * height) / 35000);
        for (let i = 0; i < fogCount; i++) {
          fogParticles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 180 + 100,
            vx: (Math.random() - 0.5) * 0.2,
            vy: (Math.random() - 0.5) * 0.2,
            alpha: Math.random() * 0.04 + 0.01
          });
        }

        dustParticles.length = 0;
        const dustCount = Math.floor((width * height) / 12000);
        for (let i = 0; i < dustCount; i++) {
          dustParticles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2 + 0.5,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3 - 0.1,
            alpha: Math.random() * 0.5 + 0.1,
            pulse: Math.random() * Math.PI * 2
          });
        }
      }

      class Particle {
        constructor(x, y, type) {
          this.x = x + (Math.random() - 0.5) * 20;
          this.y = y + (Math.random() - 0.5) * 20;
          this.type = type; // 'dust', 'smoke', 'spark'
          
          if (type === 'spark') {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 4 + 1;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0;
            this.decay = Math.random() * 0.03 + 0.02;
            this.size = Math.random() * 2.5 + 1;
          } else if (type === 'smoke') {
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = (Math.random() - 0.5) * 0.4 - 0.2;
            this.life = 1.0;
            this.decay = Math.random() * 0.015 + 0.005;
            this.size = Math.random() * 15 + 10;
          } else { // 'dust'
            this.vx = (Math.random() - 0.5) * 0.6;
            this.vy = (Math.random() - 0.5) * 0.6;
            this.life = 1.0;
            this.decay = Math.random() * 0.02 + 0.01;
            this.size = Math.random() * 3 + 1;
          }
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.life -= this.decay;
        }

        draw(ctx) {
          if (this.life <= 0) return;

          ctx.save();
          if (this.type === 'spark') {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = '#ffaa33';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ff5500';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
          } else if (this.type === 'smoke') {
            ctx.globalAlpha = this.life * 0.05;
            ctx.fillStyle = '#443344';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.globalAlpha = this.life * 0.3;
            ctx.fillStyle = '#aa8877';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      initFog();

      // =========================================================================
      // CREATURE PROCEDURAL INVERSE KINEMATICS ENGINE
      // =========================================================================

      class Segment {
        constructor(x, y, radius, index, totalSegments) {
          this.x = x;
          this.y = y;
          this.radius = radius;
          this.index = index;
          this.angle = 0;
          
          // Normalized depth along length (0 at head, 1 at tail)
          this.progress = index / totalSegments;

          // Leg Procedural Anchors (Left & Right)
          this.leftLeg = { x: x, y: y, targetX: x, targetY: y, stepProgress: 1, phase: Math.random() };
          this.rightLeg = { x: x, y: y, targetX: x, targetY: y, stepProgress: 1, phase: Math.random() };

          // Segment-specific Color Palette Mapping
          this.colorShift = Math.random();
        }
      }

      class HorrorCreature {
        constructor(segmentCount) {
          this.totalSegments = segmentCount;
          this.segments = [];
          this.head = null;

          // Physics & Kinematic Parameters
          this.maxSpeed = 7.5;
          this.acceleration = 0.18;
          this.friction = 0.90;
          this.angularVelocity = 0;
          this.speed = 0;
          this.wavePhase = 0;
          this.disturbance = 0;

          // Breathing / Idle cycles
          this.breathPhase = 0;
          this.jawOpen = 0;
          this.eyeBlinkTimer = 0;
          this.eyeOpacity = 1;

          // Construct Segment Chain
          const headX = width / 2;
          const headY = height / 2;
          const spacing = 11;

          for (let i = 0; i < this.totalSegments; i++) {
            // Tapered radius function: Large head, powerful torso, fine whip-tail
            let r;
            if (i === 0) r = 26; // Head radius
            else if (i < 10) r = 22 + (i / 10) * 6; // Neck expansion
            else if (i < 40) r = 28 - ((i - 10) / 30) * 8; // Main body taper
            else r = 20 * Math.pow(1 - (i - 40) / (this.totalSegments - 40), 1.2) + 3; // Fine tail

            const seg = new Segment(headX, headY + i * spacing, r, i, this.totalSegments);
            this.segments.push(seg);
          }

          this.head = this.segments[0];
        }

        update() {
          // --- 1. Head Motion Tracking & Kinematics ---
          const dx = mouse.x - this.head.x;
          const dy = mouse.y - this.head.y;
          const distToTarget = Math.hypot(dx, dy);
          const targetAngle = Math.atan2(dy, dx);

          // Calculate turn angle differential
          let angleDiff = targetAngle - this.head.angle;
          while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
          while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;

          // Dynamic Angular Inertia
          this.head.angle += angleDiff * 0.08;

          // Distance-based Acceleration Curve
          let targetSpeed = 0;
          if (distToTarget > 15) {
            targetSpeed = Math.min(this.maxSpeed, distToTarget * 0.04);
          }

          // Smooth Speed Interpolation
          this.speed += (targetSpeed - this.speed) * this.acceleration;
          this.speed *= this.friction;

          // Move Head
          this.head.x += Math.cos(this.head.angle) * this.speed;
          this.head.y += Math.sin(this.head.angle) * this.speed;

          // --- 2. Wave undulation math ---
          this.wavePhase += (this.speed * 0.15) + 0.03;
          this.breathPhase += 0.04;

          // Idle Animations
          if (this.speed < 0.5) {
            mouse.idleTimer += 0.016;
            this.jawOpen = (Math.sin(this.breathPhase * 1.5) * 0.5 + 0.5) * 0.3;
          } else {
            this.jawOpen = Math.min(0.8, this.speed / this.maxSpeed);
          }

          // Disturbance decay
          if (this.disturbance > 0) {
            this.disturbance -= 0.01;
          }

          // Eye Blinking / Pulse Logic
          this.eyeBlinkTimer += 0.02;
          if (Math.random() < 0.005) {
            this.eyeOpacity = 0.1; // Sudden twitch blink
          } else {
            this.eyeOpacity += (1 - this.eyeOpacity) * 0.2;
          }

          // --- 3. Body Segment Procedural Constraint Chain ---
          for (let i = 1; i < this.totalSegments; i++) {
            const prev = this.segments[i - 1];
            const curr = this.segments[i];

            // Desired segment gap
            const targetGap = 10 + (prev.radius + curr.radius) * 0.25;

            // Lateral sine wave offset (Centipede S-curve slither)
            const waveAmplitude = Math.sin(this.wavePhase - i * 0.18) * Math.min(10, this.speed * 1.2 + 2);
            
            // Perpendicular wave offset angle
            const waveAngle = prev.angle + Math.PI / 2;
            const offsetX = Math.cos(waveAngle) * waveAmplitude * (i / this.totalSegments);
            const offsetY = Math.sin(waveAngle) * waveAmplitude * (i / this.totalSegments);

            const segDx = (curr.x - (prev.x + offsetX));
            const segDy = (curr.y - (prev.y + offsetY));
            const segDist = Math.hypot(segDx, segDy);

            curr.angle = Math.atan2(prev.y - curr.y, prev.x - curr.x);

            if (segDist > 0) {
              curr.x = prev.x + offsetX + (segDx / segDist) * targetGap;
              curr.y = prev.y + offsetY + (segDy / segDist) * targetGap;
            }

            // --- 4. Procedural Leg Step Kinematics ---
            if (i > 2 && i < this.totalSegments - 5 && i % 2 === 0) {
              this.updateLegs(curr);
            }

            // Emit motion particles from body segments
            if (this.speed > 3 && Math.random() < 0.15 && i % 10 === 0) {
              particles.push(new Particle(curr.x, curr.y, 'smoke'));
            }
          }
        }

        updateLegs(segment) {
          const legReach = segment.radius * 2.2;
          const angle = segment.angle;

          // Left & Right relative normal angles
          const leftAngle = angle - Math.PI / 2 - 0.2;
          const rightAngle = angle + Math.PI / 2 + 0.2;

          // Update Left Leg
          this.updateSingleLeg(segment, segment.leftLeg, leftAngle, legReach);
          // Update Right Leg
          this.updateSingleLeg(segment, segment.rightLeg, rightAngle, legReach);
        }

        updateSingleLeg(segment, leg, sideAngle, reach) {
          // Calculate rest target position on ground
          const idealX = segment.x + Math.cos(sideAngle) * reach;
          const idealY = segment.y + Math.sin(sideAngle) * reach;

          const distToTarget = Math.hypot(leg.x - idealX, leg.y - idealY);

          // Step Triggering Threshold
          if (distToTarget > reach * 1.2) {
            leg.targetX = idealX + Math.cos(segment.angle) * (this.speed * 4);
            leg.targetY = idealY + Math.sin(segment.angle) * (this.speed * 4);
            leg.stepProgress = 0;
          }

          // Smooth Step Interpolation
          if (leg.stepProgress < 1) {
            leg.stepProgress += 0.15 + (this.speed / this.maxSpeed) * 0.2;
            leg.x += (leg.targetX - leg.x) * 0.4;
            leg.y += (leg.targetY - leg.y) * 0.4;
          }

          // Random Idle Twitch
          if (this.speed < 0.2 && Math.random() < 0.01) {
            leg.x += (Math.random() - 0.5) * 6;
            leg.y += (Math.random() - 0.5) * 6;
          }
        }

        // =========================================================================
        // RENDERING PIPELINE (High Detail Shading & Textures)
        // =========================================================================

        draw(ctx) {
          // Render Layers: 1. Dynamic Shadows -> 2. Legs -> 3. Body Plates -> 4. Head & Jaws -> 5. Eyes
          this.drawShadows(ctx);
          this.drawLegs(ctx);
          this.drawBodySegments(ctx);
          this.drawHead(ctx);
        }

        drawShadows(ctx) {
          ctx.save();
          ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.shadowBlur = 15;
          ctx.shadowColor = 'black';

          // Render soft offset body shadow
          for (let i = this.totalSegments - 1; i >= 0; i--) {
            const seg = this.segments[i];
            ctx.beginPath();
            ctx.arc(seg.x + 15, seg.y + 20, seg.radius * 1.1, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        drawLegs(ctx) {
          ctx.save();
          for (let i = 2; i < this.totalSegments - 5; i += 2) {
            const seg = this.segments[i];
            
            this.drawJointedLeg(ctx, seg, seg.leftLeg);
            this.drawJointedLeg(ctx, seg, seg.rightLeg);
          }
          ctx.restore();
        }

        drawJointedLeg(ctx, seg, leg) {
          ctx.strokeStyle = '#120a14';
          ctx.lineWidth = Math.max(1.5, seg.radius * 0.25);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          // Multi-joint IK knee calculation
          const midX = (seg.x + leg.x) / 2 + Math.cos(seg.angle) * (seg.radius * 0.8);
          const midY = (seg.y + leg.y) / 2 + Math.sin(seg.angle) * (seg.radius * 0.8);

          // Draw Segment-to-Knee-to-Claw
          ctx.beginPath();
          ctx.moveTo(seg.x, seg.y);
          ctx.lineTo(midX, midY);
          ctx.lineTo(leg.x, leg.y);
          ctx.stroke();

          // Highlight leg chitin
          ctx.strokeStyle = 'rgba(100, 40, 60, 0.4)';
          ctx.lineWidth = Math.max(1, seg.radius * 0.1);
          ctx.stroke();

          // Sharp claw tip
          ctx.fillStyle = '#220005';
          ctx.beginPath();
          ctx.arc(leg.x, leg.y, 2, 0, Math.PI * 2);
          ctx.fill();
        }

        drawBodySegments(ctx) {
          ctx.save();

          // Draw segments from Tail to Head for proper depth overlapping
          for (let i = this.totalSegments - 1; i >= 1; i--) {
            const seg = this.segments[i];
            const p = seg.progress;

            ctx.save();
            ctx.translate(seg.x, seg.y);
            ctx.rotate(seg.angle);

            // Dynamic Chitin Color Gradient per segment
            const gradient = ctx.createLinearGradient(-seg.radius, -seg.radius, seg.radius, seg.radius);
            
            // Color Shift Palette: Dark Cyan -> Deep Purple -> Dark Emerald -> Deep Crimson
            if (i % 3 === 0) {
              gradient.addColorStop(0, '#1a0510');
              gradient.addColorStop(0.5, '#2b0b1e');
              gradient.addColorStop(1, '#050208');
            } else if (i % 3 === 1) {
              gradient.addColorStop(0, '#0a151b');
              gradient.addColorStop(0.5, '#12252e');
              gradient.addColorStop(1, '#020608');
            } else {
              gradient.addColorStop(0, '#0a1a12');
              gradient.addColorStop(0.5, '#122e20');
              gradient.addColorStop(1, '#020805');
            }

            // Chitin Carapace Shell Path
            ctx.fillStyle = gradient;
            ctx.strokeStyle = `rgba(180, 50, 70, ${0.15 + (1 - p) * 0.25})`;
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            // Pointed armor shell shape
            const width = seg.radius * 1.2;
            const length = seg.radius * 1.4;
            
            ctx.moveTo(length * 0.6, 0);
            ctx.quadraticCurveTo(0, -width, -length * 0.6, -width * 0.8);
            ctx.lineTo(-length * 0.4, 0);
            ctx.lineTo(-length * 0.6, width * 0.8);
            ctx.quadraticCurveTo(0, width, length * 0.6, 0);
            ctx.closePath();

            ctx.fill();
            ctx.stroke();

            // Organic Carapace Center Ridge Highlight
            ctx.strokeStyle = `rgba(255, 200, 200, ${0.08 + (1 - p) * 0.12})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-length * 0.4, 0);
            ctx.lineTo(length * 0.5, 0);
            ctx.stroke();

            // Sharp Side Spines along torso
            if (i < this.totalSegments - 10 && i % 2 === 0) {
              ctx.fillStyle = '#0f0308';
              ctx.strokeStyle = 'rgba(255, 50, 50, 0.3)';
              
              // Left spine
              ctx.beginPath();
              ctx.moveTo(0, -width * 0.8);
              ctx.lineTo(-seg.radius * 0.5, -width * 1.6);
              ctx.lineTo(seg.radius * 0.3, -width * 0.9);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();

              // Right spine
              ctx.beginPath();
              ctx.moveTo(0, width * 0.8);
              ctx.lineTo(-seg.radius * 0.5, width * 1.6);
              ctx.lineTo(seg.radius * 0.3, width * 0.9);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            }

            ctx.restore();
          }

          ctx.restore();
        }

        drawHead(ctx) {
          const head = this.head;
          const r = head.radius;

          ctx.save();
          ctx.translate(head.x, head.y);
          ctx.rotate(head.angle);

          // 1. Mandibles / Jaws
          const jawAngle = this.jawOpen * 0.4;

          // Upper Jaw / Left Mandible
          ctx.save();
          ctx.rotate(-jawAngle);
          this.drawMandible(ctx, r, -1);
          ctx.restore();

          // Lower Jaw / Right Mandible
          ctx.save();
          ctx.rotate(jawAngle);
          this.drawMandible(ctx, r, 1);
          ctx.restore();

          // 2. Main Cranium Skull Armor
          const headGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, r * 1.5);
          headGrad.addColorStop(0, '#2b0814');
          headGrad.addColorStop(0.6, '#120308');
          headGrad.addColorStop(1, '#050003');

          ctx.fillStyle = headGrad;
          ctx.strokeStyle = '#551122';
          ctx.lineWidth = 2;

          ctx.beginPath();
          ctx.moveTo(r * 1.3, 0); // Snout tip
          ctx.quadraticCurveTo(r * 0.8, -r * 1.3, -r * 0.6, -r * 1.1); // Left brow
          ctx.quadraticCurveTo(-r * 1.2, 0, -r * 0.6, r * 1.1); // Crown / Back
          ctx.quadraticCurveTo(r * 0.8, r * 1.3, r * 1.3, 0); // Right brow
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // 3. Sweeping Horns
          this.drawHorn(ctx, -r * 0.4, -r * 0.8, -Math.PI * 0.75, r);
          this.drawHorn(ctx, -r * 0.4, r * 0.8, Math.PI * 0.75, r);

          // 4. Eyes (Terrifying Multi-faceted Glow)
          this.drawEyes(ctx, r);

          ctx.restore();
        }

        drawMandible(ctx, r, side) {
          ctx.fillStyle = '#110206';
          ctx.strokeStyle = '#ff2244';
          ctx.lineWidth = 1;

          ctx.beginPath();
          ctx.moveTo(r * 0.5, side * (r * 0.4));
          ctx.quadraticCurveTo(r * 1.8, side * (r * 1.1), r * 2.2, side * (r * 0.2)); // Sharp pincer tip
          ctx.quadraticCurveTo(r * 1.2, side * (r * 0.2), r * 0.5, side * (r * 0.4));
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Sharp Teeth inside mandibles
          ctx.fillStyle = '#eeeeee';
          for (let i = 0; i < 4; i++) {
            const t = 0.8 + i * 0.3;
            ctx.beginPath();
            ctx.moveTo(r * t, side * (r * (0.5 + i * 0.1)));
            ctx.lineTo(r * (t + 0.1), side * (r * 0.3));
            ctx.lineTo(r * (t + 0.2), side * (r * (0.5 + i * 0.1)));
            ctx.fill();
          }
        }

        drawHorn(ctx, x, y, angleOffset, r) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angleOffset);

          const hornGrad = ctx.createLinearGradient(0, 0, r * 2, 0);
          hornGrad.addColorStop(0, '#150508');
          hornGrad.addColorStop(0.7, '#4a0e17');
          hornGrad.addColorStop(1, '#ff3344');

          ctx.fillStyle = hornGrad;
          ctx.beginPath();
          ctx.moveTo(0, -3);
          ctx.quadraticCurveTo(r * 1.2, -8, r * 2.2, -2); // Curved sharp horn
          ctx.quadraticCurveTo(r * 1.0, 4, 0, 3);
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        }

        drawEyes(ctx, r) {
          const eyeTheme = EYE_COLORS[currentEyeColorIndex];
          const blinkAlpha = this.eyeOpacity;

          // Primary Pair of Large Eyes + Secondary Cluster
          const eyePositions = [
            { x: r * 0.6, y: -r * 0.5, size: 5.5 },
            { x: r * 0.6, y: r * 0.5, size: 5.5 },
            { x: r * 0.2, y: -r * 0.7, size: 3.5 },
            { x: r * 0.2, y: r * 0.7, size: 3.5 },
            { x: r * 0.8, y: -r * 0.25, size: 3.0 },
            { x: r * 0.8, y: r * 0.25, size: 3.0 }
          ];

          eyePositions.forEach((eye) => {
            ctx.save();
            
            // Outer Eerie Radial Glow
            const glowRadius = eye.size * (3 + Math.sin(this.breathPhase * 2) * 0.5 + this.disturbance * 2);
            const eyeGlow = ctx.createRadialGradient(eye.x, eye.y, 0, eye.x, eye.y, glowRadius);
            eyeGlow.addColorStop(0, eyeTheme.glow + (0.9 * blinkAlpha) + ')');
            eyeGlow.addColorStop(0.4, eyeTheme.glow + (0.3 * blinkAlpha) + ')');
            eyeGlow.addColorStop(1, eyeTheme.glow + '0)');

            ctx.fillStyle = eyeGlow;
            ctx.beginPath();
            ctx.arc(eye.x, eye.y, glowRadius, 0, Math.PI * 2);
            ctx.fill();

            // Core Solid Lens
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = eyeTheme.hex;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(eye.x, eye.y, eye.size * 0.6 * blinkAlpha, 0, Math.PI * 2);
            ctx.fill();

            // Slit Pupil
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(eye.x, eye.y, eye.size * 0.5 * blinkAlpha, eye.size * 0.1, Math.PI / 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
          });
        }
      }

      // Instantiate Creature Chain (100 Segments)
      const creature = new HorrorCreature(100);

      // =========================================================================
      // MAIN ANIMATION LOOP (Target 60 FPS)
      // =========================================================================

      function renderAtmosphere() {
        // Clear frame with persistent dark trail / smoke fog
        ctx.fillStyle = 'rgba(2, 1, 3, 0.28)';
        ctx.fillRect(0, 0, width, height);

        // Render Drifting Background Fog
        ctx.save();
        for (let i = 0; i < fogParticles.length; i++) {
          const f = fogParticles[i];
          f.x += f.vx;
          f.y += f.vy;

          if (f.x < -f.radius) f.x = width + f.radius;
          if (f.x > width + f.radius) f.x = -f.radius;
          if (f.y < -f.radius) f.y = height + f.radius;
          if (f.y > height + f.radius) f.y = -f.radius;

          const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
          g.addColorStop(0, 'rgba(25, 10, 20, ' + f.alpha + ')');
          g.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Render Dust & Floating Ash
        ctx.save();
        for (let i = 0; i < dustParticles.length; i++) {
          const d = dustParticles[i];
          d.x += d.vx;
          d.y += d.vy;
          d.pulse += 0.02;

          if (d.x < 0) d.x = width;
          if (d.x > width) d.x = 0;
          if (d.y < 0) d.y = height;
          if (d.y > height) d.y = 0;

          const alpha = d.alpha * (0.5 + Math.sin(d.pulse) * 0.5);
          ctx.fillStyle = `rgba(200, 160, 160, ${alpha})`;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function animate() {
        // 1. Atmosphere Background Update
        renderAtmosphere();

        // 2. Creature Kinematics & Render
        creature.update();
        creature.draw(ctx);

        // 3. Dynamic Particles Update
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          p.draw(ctx);
          if (p.life <= 0) particles.splice(i, 1);
        }

        // Auto-fade UI hint overlay after user interaction
        if (mouse.idleTimer > 4 && overlayText.style.opacity !== '0') {
          overlayText.style.opacity = '0';
        } else if (mouse.idleTimer <= 1 && overlayText.style.opacity === '0') {
          overlayText.style.opacity = '1';
        }

        requestAnimationFrame(animate);
      }

      // Kick off animation loop
      animate();
    });
  </script>
